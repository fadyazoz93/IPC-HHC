<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26522" />
      <stop offset="100%" stop-color="#D44908" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Badge with Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Inner Soft Medical Shield Glow -->
  <circle cx="32" cy="32" r="23" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Water Drop / Sanitizer Droplet in Center-Top -->
  <path d="M32 12 C32 12 24 22 24 27 C24 31.4 27.6 35 32 35 C36.4 35 40 31.4 40 27 C40 22 32 12 32 12 Z" fill="url(#dropGrad)" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- Droplet Glint / Sparkle -->
  <path d="M28 24 C28 21 30 18 31 16.5 C30.5 19 30 22 31 24.5 C31.5 25.5 30 26 29 25.5 C28.4 25.2 28 24.7 28 24 Z" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="35.5" cy="27.5" r="1.2" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Sparkle Plus on Droplet (Infection Control / Medical Cleanliness) -->
  <path d="M32 23 L32 29 M29 26 L35 26" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />

  <!-- Stylized Cupped Hands (Support & Hygiene) -->
  <!-- Left Hand -->
  <path d="M14 42 C16 38 20 37 25 39 L31 41.5 C32 42 31.5 44 30 44 L23.5 43 C21.5 42.5 19 44 17.5 46.5 C16 49 19 51 23 50.5 L34 49 C37 48.5 40 50 39.5 52 C39 54 35 55 31 55 C22 55 13 48 14 42 Z" fill="#FFFFFF" />
  
  <!-- Right Hand -->
  <path d="M50 42 C48 38 44 37 39 39 L33 41.5 C32 42 32.5 44 34 44 L40.5 43 C42.5 42.5 45 44 46.5 46.5 C48 49 45 51 41 50.5 L30 49 C27 48.5 24 50 24.5 52 C25 54 29 55 33 55 C42 55 51 48 50 42 Z" fill="#FFFFFF" fill-opacity="0.92" />
</svg>
