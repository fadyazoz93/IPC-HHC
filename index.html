<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHO Hand Hygiene Compliance</title>
    
    <!-- Favicon & App Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#0284C7">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    

    
    <style>
      /* Fonts: Plus Jakarta Sans & JetBrains Mono for English/telemetry, Cairo for Arabic */
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      
      body {
        background-color: #f4f8fc;
        font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
        color: #1e293b;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* WHO Form Specific Styles */
      .who-header-bg { background: linear-gradient(135deg, #F26522 0%, #EA580C 60%, #D94E0F 100%); }
      
      /* Checkbox & Radio - Touch Friendly */
      .form-checkbox { appearance: none; width: 22px; height: 22px; border: 2px solid #334155; background: white; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1); border-radius: 5px; }
      .form-checkbox:hover { border-color: #F26522; transform: scale(1.04); }
      .form-checkbox.checked { background-color: #F26522; border-color: #F26522; box-shadow: 0 2px 8px rgba(242, 101, 34, 0.25); }
      .form-checkbox.checked:after { content: '✔'; font-size: 14px; color: white; font-weight: bold; }
      
      .form-radio { appearance: none; width: 22px; height: 22px; border: 2px solid #334155; border-radius: 50%; background: white; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1); }
      .form-radio:hover { border-color: #F26522; transform: scale(1.04); }
      .form-radio.checked { border-color: #F26522; }
      .form-radio.checked:after { content: ''; width: 12px; height: 12px; background: #F26522; border-radius: 50%; }
      
      /* Input Styles - Text base for mobile to prevent zoom */
      .form-input-bg { background-color: rgba(255, 255, 255, 0.92); border: 1px solid #cbd5e1; padding: 6px 8px; width: 100%; font-weight: 600; font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; border-radius: 8px; font-size: 16px; text-align: center; /* Prevents iOS zoom and centers text */ }
      .form-input-bg:focus { outline: none; border-color: #0284C7; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.14); background-color: #ffffff; }
      
      /* Print overrides */
      @media print {
        @page { 
            size: A4 portrait; 
            margin: 0; 
        } 
        
        html, body { 
          width: 1024px !important;
          min-width: 1024px !important;
          height: auto !important; 
          margin: 0 !important; 
          padding: 0 !important; 
          background-color: white !important; 
          -webkit-print-color-adjust: exact; 
          print-color-adjust: exact; 
          font-size: 9pt; 
          color: black; 
          overflow: visible !important;
        }
        
        .no-print, nav, button, .app-header-bg, .mobile-nav, input[type="month"] { display: none !important; }
        
        #root { 
          width: 100% !important; margin: 0 !important; padding: 0 !important; height: auto !important;
        }

        /* RESET APP CONTAINER PADDING/MARGIN IN PRINT */
        .app-container {
            padding: 0 !important;
            margin: 0 !important;
            min-height: 0 !important;
            height: auto !important;
            display: block !important;
        }

        /* Reset aggressive resets so we can use borders */
        .shadow, .shadow-xl, .shadow-md, .rounded, .rounded-lg, .p-6 { 
          box-shadow: none !important; 
        }
        
        /* Remove outer card borders/shadows but keep structure */
        .paper-container {
             border: none !important;
             box-shadow: none !important;
             margin: 0 !important;
             padding: 0 !important;
             display: flex !important;
             flex-direction: column !important;
        }

        /* 
           PAGE WRAPPER 
        */
        .print-centered-page {
            width: 1024px !important;
            max-width: 1024px !important;
            height: 1448px !important;
            max-height: 1448px !important;
            overflow: hidden !important;
            position: relative;
            padding: 0 !important;
            margin: 0 auto !important;
            display: block !important;
            page-break-after: always !important;
            break-after: page !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            box-sizing: border-box;
            background: white !important;
            transform-origin: top left;
        }
        
        /* 
           CONTENT SCALING 
        */
        .paper-container, .print-report-container {
             width: 1024px !important; 
             max-width: 1024px !important;
             height: 1448px !important;
             max-height: 1448px !important;
             margin: 0 auto !important;
             box-shadow: none !important;
             border: none !important;
             min-height: 0 !important;
             display: flex !important;
             flex-direction: column !important;
             page-break-inside: avoid !important;
             break-inside: avoid !important;
        }
        
        .dashboard-print-container {
             width: 1024px !important; 
             max-width: 1024px !important;
             margin: 0 auto !important;
             box-shadow: none !important;
             border: none !important;
             height: auto !important; 
             min-height: 0 !important;
             display: block !important;
        }
        
        /* Prevent awkward breaks inside charts and table rows */
        .recharts-responsive-container, .recharts-wrapper, tr, .bg-white.p-6.rounded-lg {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        /* Dashboard specific: Ensure it takes height but respects scaling */

        /* Last page logic - Force NO break after */
        .print-centered-page:last-child,
        .print-centered-page.last-page,
        .print-last-page {
            page-break-after: auto !important;
            break-after: auto !important;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        .print-page-break { display: none !important; }

        /* Header Styling in Print */
        .who-header-bg { 
            background: #F26522 !important; 
            color: white !important; 
            padding: 3mm 0 !important;
            border-bottom: 2px solid #c1501b !important;
            flex-shrink: 0;
            width: 100%;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .who-header-title { font-size: 14pt !important; line-height: 1.1 !important; margin: 0 !important; }
        .who-header-subtitle { font-size: 10pt !important; margin: 0 !important; }
        .who-header-main { font-size: 14pt !important; margin-top: 2px !important; padding-top: 2px !important; border-top-width: 1px !important; }
        .who-header-logo {
            max-height: 14mm !important;
            max-width: 25mm !important;
            object-fit: contain !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .print-content-wrapper {
            flex-grow: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 0 !important;
            height: 100% !important;
            min-height: 0 !important;
        }

        h1 { font-size: 14pt !important; margin-bottom: 4px !important; }

        /* Grid - Relaxed gaps since we are scaling down */
        .grid { display: grid !important; margin-bottom: 2mm !important; }
        .gap-x-8 { column-gap: 1rem !important; }
        .gap-y-1 { row-gap: 4px !important; } 
        
        .form-input-row { margin-bottom: 2px !important; }

        /* 
           INPUT STYLING FOR PRINT 
         */
        .form-input-print-text {
            border: 1px solid #cbd5e1 !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            font-family: 'Cairo', 'Inter', sans-serif !important;
            font-weight: 700 !important;
            font-size: 13pt !important; /* Larger font size to fit the cell space perfectly */
            background-color: #fff !important;
            color: #1e293b !important;
            min-height: 36px !important;
            display: flex !important;
            align-items: center; /* Vertically center */
            justify-content: center; /* Horizontally center */
            text-align: center !important;
            line-height: 1.2 !important;
        }
        
        /* Checkboxes & Radios */
        .form-checkbox { 
            width: 16px !important; 
            height: 16px !important; 
            border: 2px solid #334155 !important; 
            background: white !important; 
            margin-right: 6px !important; 
            border-radius: 4px !important; 
        }
        .form-checkbox.checked { 
            background-color: #F26522 !important; 
            border-color: #F26522 !important; 
        }
        .form-checkbox.checked:after { 
            content: '✔'; 
            font-size: 10px !important; 
            color: white !important; 
            font-weight: bold; 
            line-height: 14px; 
            position: static !important;
        }
        
        .form-radio { 
            width: 16px !important; 
            height: 16px !important; 
            border: 2px solid #334155 !important; 
            margin-right: 6px !important; 
        }
        .form-radio.checked:after { 
            background: #F26522 !important; 
            width: 8px !important; 
            height: 8px !important; 
        }

        /* Checkbox and Radio Labels Font Styling */
        .form-checkbox + span, .form-radio + span {
            font-size: 12pt !important;
            font-weight: 700 !important;
        }

        /* Professional Columns */
        .prof-main-container { 
            border: 2px solid #334155 !important; 
            flex-grow: 0 !important; 
            display: flex !important;
            flex-direction: column !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            height: auto !important; 
            border-radius: 6px !important;
            overflow: visible !important;
        }
        
        .prof-cols-row {
            flex-grow: 0 !important;
            display: flex !important;
            flex-direction: row !important; /* Force row in print */
            height: auto !important; 
            width: 100% !important;
        }

        .prof-col-wrapper {
             width: 25% !important;
             flex: 0 0 25% !important;
             border-right: 2px solid #334155 !important;
             border-bottom: none !important; /* Ensure no bottom border in print */
             display: flex !important;
             flex-direction: column !important;
             height: auto !important; 
        }
        .prof-col-wrapper:last-child { border-right: none !important; }

        .prof-col-container {
             height: auto !important; 
             width: 100%;
             display: flex;
             flex-direction: column;
        }

        .prof-header-row {
            height: auto !important;
            min-height: 8mm;
            border-bottom: 2px solid #334155 !important;
            background-color: #ffe4cc !important;
            padding: 4px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        
        .prof-cat-val-container {
            border: 1px solid #94a3b8 !important;
            border-radius: 4px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Inter', sans-serif !important;
            font-size: 11pt !important; /* Clear, larger font for printing */
            font-weight: 700 !important;
            color: #1e293b !important;
        }

        /* Table Layout */
        .prof-col-table {
            width: 100%;
            height: auto !important; 
            border-collapse: collapse;
            flex-grow: 0 !important;
        }
        .prof-col-table thead { height: auto; }
        .prof-col-table tbody { height: auto !important; display: table-row-group; }
        .prof-col-table th { 
            border-right: 1px solid #94a3b8 !important; 
            border-bottom: 2px solid #334155 !important;
            background-color: #ffe4cc !important; 
            padding: 2px !important; 
            font-size: 9pt !important; 
            height: 6mm; 
        }
        .prof-col-table td { border: 1px solid #cbd5e1 !important; padding: 0 !important; }
        
        .prof-col-table tbody tr {
            height: auto !important;
        }
        
        /* Alternating rows for readability like screen */
        .print-opp-row:nth-child(even) { background-color: #f8fafc !important; }

        /* ENHANCED FOOTER */
        .print-footer { 
            margin-top: auto !important; 
            padding-top: 1mm !important; 
            border-top: 1px solid #334155 !important; 
            font-size: 7pt !important; 
            font-weight: 600 !important; 
            color: #1e293b !important;
            flex-shrink: 0;
            width: 100%;
            text-align: center;
            background-color: white !important;
            line-height: 1.2 !important;
        }
        
        /* Reports Table */
        .report-table { border: 2px solid #1e293b !important; width: 100% !important; font-size: 10pt !important; table-layout: fixed !important; border-collapse: collapse !important; font-family: 'Cairo', 'Inter', sans-serif !important; }
        .report-table th, .report-table td { border: 1px solid #475569 !important; padding: 4px 6px !important; color: #1e293b !important; text-align: center; }
        .report-table th { background-color: #ffe4cc !important; }

        .overflow-x-auto, .overflow-y-auto, .overflow-hidden, .overflow-auto { overflow: visible !important; }
        .print-hidden { display: none !important; }
      }
      
      .prof-col { min-width: 200px; width: 100%; }
      .paper-container { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); border-radius: 0.5rem; }

      .diagonal-split {
        position: relative;
        background-image: linear-gradient(to top right, transparent calc(50% - 1.5px), #475569 calc(50% - 1.5px), #475569 calc(50% + 1.5px), transparent calc(50% + 1.5px));
      }
      
      .report-table { border: 2px solid #1e293b; border-collapse: collapse; font-family: 'Cairo', 'Inter', sans-serif; }
      .report-table th, .report-table td { border: 1px solid #475569; text-align: center; }
      .report-table .header-row th { border-bottom: 2px solid #1e293b; }
      .report-table .group-divider { border-right: 2px solid #1e293b !important; }
      .report-table .total-row td { border-top: 2px solid #1e293b; border-bottom: 2px solid #1e293b; }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>

    
  <script type="module" src="/index.tsx"></script>
</body>
</html>
